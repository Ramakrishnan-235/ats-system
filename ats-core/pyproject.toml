[project]
name = "ats-core"
version = "0.1.0"
description = "AI-powered ATS core engine with layout parsing, PII redaction, and structured LLM evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.29.0",
    "celery[redis]>=5.4.0",
    "docling>=2.0.0",
    "fastapi>=0.115.0",
    "fastembed>=0.3.0",
    "httpx>=0.27.0",
    "instructor>=1.4.0",
    "openai>=1.40.0",
    "pgvector>=0.3.0",
    "presidio-analyzer>=2.2.350",
    "presidio-anonymizer>=2.2.350",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.9",
    "rank-bm25>=0.2.2",
    "redis>=5.0.0",
    "reportlab>=4.2.0",
    "rich>=13.8.0",
    "sentence-transformers>=3.0.0",
    "sqlalchemy>=2.0.0",
    "torch>=2.2.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
