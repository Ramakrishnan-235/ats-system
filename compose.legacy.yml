services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ats_user
      POSTGRES_PASSWORD: ats_password
      POSTGRES_DB: ats_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats_user -d ats_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ats-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    gpus: all
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    healthcheck:
      test: ["CMD", "ollama", "show", "gemma4:e2b"]
      interval: 10s
      timeout: 5s
      retries: 10

  embeddinggemma2:
    build:
      context: ./ats-core
      dockerfile: Dockerfile.embeddings
    container_name: ats-embeddinggemma2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - embedding_models:/models/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  ats-core-go:
    build:
      context: ./ats-core-go
      dockerfile: Dockerfile
    container_name: ats-core-go
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://ats_user:ats_password@postgres:5432/ats_db
      - ATS_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - ATS_AUTH_ENABLED=false
      - ATS_LLM_ENABLED=true
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_MODEL=gemma4:e2b
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
  embedding_models:
